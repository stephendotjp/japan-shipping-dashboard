
<style>

.n-danger { background: var(--color-background-danger); color: var(--color-text-danger); }
.body { display: flex; flex: 1; min-height: 0; }
.sidebar { width: 200px; flex-shrink: 0; border-right: 0.5px solid var(--color-border-tertiary); display: flex; flex-direction: column; min-height: 0; }
.dest-list { overflow-y: auto; flex: 1; }
.dest-list::-webkit-scrollbar { width: 3px; }
.dest-list::-webkit-scrollbar-thumb { background: var(--color-border-secondary); border-radius: 2px; }

.dest-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 1rem; background: none; border: none; font-family: var(--font-sans); font-size: 13px; color: var(--color-text-primary); cursor: pointer; text-align: left; }
.dest-btn:hover { background: var(--color-background-secondary); }
.dest-btn.active { background: var(--color-background-info); color: var(--color-text-info); font-weight: 500; }
.dflag { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.dname { flex: 1; min-width: 0; }
.dbadge { font-size: 9.5px; font-weight: 500; padding: 2px 5px; border-radius: 3px; flex-shrink: 0; }

.detail { flex: 1; min-width: 0; overflow-y: auto; }

.placeholder { padding: 3rem 1.5rem; text-align: center; color: var(--color-text-tertiary); }
.placeholder i { font-size: 28px; display: block; margin-bottom: 8px; }
.placeholder p { font-size: 13px; }
.dp { padding: 1.125rem 1.25rem; }

.dest-name { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }

.sec-head { font-size: 10px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; }

.edit-hint { font-size: 10.5px; color: var(--color-text-tertiary); font-style: italic; font-weight: 400; letter-spacing: 0; text-transform: none; }

/* Carrier table — matches the screenshot style */
.carrier-table { width: 100%; border-collapse: collapse; }

/* Status dropdown — styled to look like the pill in the screenshot */

.status-select-wrap.s-warn { background: var(--color-background-warning); border-color: var(--color-border-warning); }

.s-warn .status-dot { background: var(--color-text-warning); }
.s-no   .status-dot { background: var(--color-text-danger); }
.s-q    .status-dot { background: var(--color-text-secondary); }
.status-select { font-family: var(--font-sans); font-size: 12px; font-weight: 500; border: none; background: transparent; outline: none; cursor: pointer; padding: 0; padding-right: 2px; appearance: none; -webkit-appearance: none; }
.s-ok   .status-select { color: var(--color-text-success); }
.s-warn .status-select { color: var(--color-text-warning); }
.s-no   .status-select { color: var(--color-text-danger); }

.s-ok   .chevron-icon { color: var(--color-text-success); }
.s-warn .chevron-icon { color: var(--color-text-warning); }
.s-no   .chevron-icon { color: var(--color-text-danger); }

.rules-list { display: flex; flex-direction: column; gap: 4px; }
.rule-item { display: flex; align-items: flex-start; gap: 7px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); font-size: 12px; color: var(--color-text-primary); line-height: 1.45; overflow: hidden; }

.rule-text:focus { background: var(--color-background-primary); border-radius: 3px; }
.rule-del { background: none; border: none; color: var(--color-text-tertiary); cursor: pointer; font-size: 14px; padding: 7px 8px; flex-shrink: 0; display: flex; align-items: flex-start; }
.rule-del:hover { color: var(--color-text-danger); }

.notes-area { width: 100%; background: var(--color-background-secondary); border: none; border-radius: var(--border-radius-md); padding: 9px 11px; font-family: var(--font-sans); font-size: 12px; color: var(--color-text-primary); line-height: 1.55; min-height: 60px; resize: vertical; outline: none; }
.notes-area:focus { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); }

.sep { height: 0.5px; background: var(--color-border-tertiary); margin: 0.875rem 0; }

<script>

const D = {
  usa:       { flag:'🇺🇸', name:'USA',                   region:'North America',
    carriers:[{name:'Japan Post',s:'warn',note:'Limited resumption April 2026 — verify per item type.'},{name:'FedEx',s:'warn',note:'DDP only — confirm terms before booking.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],

  uk:        { flag:'🇬🇧', name:'UK',                     region:'Europe',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Full value declaration required.'}],
    rules:['Post-Brexit: all shipments require HS commodity codes','DHL: full declared value mandatory','IOSS number required for B2C orders under £135'],
    notes:'' },
  germany:   { flag:'🇩🇪', name:'Germany',                region:'Europe',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],

    carriers:[{name:'Japan Post',s:'warn',note:'Check JP advisory — suspensions have applied.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['Verify Japan Post acceptance before booking','Codice Fiscale may be required for some shipments','IOSS number required for B2C orders under €150'],
    notes:'Italy has periodically appeared on JP suspension lists. Always confirm JP on day of booking.' },
  benelux:   { flag:'🇧🇪', name:'Belgium / Netherlands',  region:'Europe',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['IOSS number required for B2C orders under €150','Full declared value on all shipments'],
    notes:'' },
  sweden:    { flag:'🇸🇪', name:'Sweden',                 region:'Europe',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['IOSS number required for B2C orders under €150','Declare full value — undervalue flagged at customs'],
    notes:'' },
  norway:    { flag:'🇳🇴', name:'Norway',                 region:'Europe — non-EU',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['Norway is outside the EU — IOSS does not apply','All goods subject to Norwegian customs and VAT','Shipments over NOK 350 subject to import duties'],
    notes:'Norway processes customs independently. Do not apply EU IOSS to Norwegian orders.' },
  denmark:   { flag:'🇩🇰', name:'Denmark',                region:'Europe',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['IOSS number required for B2C orders under €150','Full declared value on all shipments'],
    notes:'' },
  finland:   { flag:'🇫🇮', name:'Finland',                region:'Europe',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['IOSS number required for B2C orders under €150','Full declared value on all shipments'],
    notes:'' },
  brazil:    { flag:'🇧🇷', name:'Brazil',                 region:'Latin America',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational — CPF or CNPJ required.'},{name:'FedEx',s:'ok',note:'Operational — CPF or CNPJ required.'},{name:'UPS',s:'ok',note:'Operational — CPF or CNPJ required.'},{name:'DHL',s:'ok',note:'Operational — CPF or CNPJ required.'}],
    rules:['CPF required for individual recipients (11 digits)','CNPJ required for company recipients (14 digits)','Missing tax ID causes customs hold or return — collect at order time'],
    notes:'Validate CPF/CNPJ format before submitting. Invalid numbers cause automatic rejection.' },
  latam:     { flag:'🌎', name:'Latin America (other)',    region:'Latin America — excl. Brazil & Mexico',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational — verify per country.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['Check Japan Post advisory per country before booking','Some countries may require importer tax ID — confirm with carrier'],
    notes:'Brazil and Mexico are listed separately due to mandatory tax ID requirements.' },
  australia: { flag:'🇦🇺', name:'Australia',              region:'Asia Pacific',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['Goods over AUD 1,000 subject to import duties and GST','Strict biosecurity — never ship food, plants, or animal products'],
    notes:'' },
  china:     { flag:'🇨🇳', name:'China',                  region:'Asia Pacific',
    carriers:[{name:'Japan Post',s:'warn',note:'Check advisory — periodic delays and restrictions.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['Recipient ID number required for customs clearance','Restricted categories: cosmetics, supplements, electronics — verify before shipping','JP delays common — use courier for time-sensitive orders'],
    notes:'China customs regulations change frequently. Confirm current requirements per shipment category.' },
  korea:     { flag:'🇰🇷', name:'South Korea',            region:'Asia Pacific',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['Personal customs clearance ID (PCCC) required for B2C shipments','Goods over KRW 150,000 subject to duties'],
    notes:'' },
  taiwan:    { flag:'🇹🇼', name:'Taiwan',                 region:'Asia Pacific',
    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['Declare full value — customs checks declared vs. market value','Goods over TWD 2,000 may be subject to duties'],

    carriers:[{name:'Japan Post',s:'ok',note:'Operational.'},{name:'FedEx',s:'ok',note:'Operational.'},{name:'UPS',s:'ok',note:'Operational.'},{name:'DHL',s:'ok',note:'Operational.'}],
    rules:['All imports over SGD 400 subject to GST','Chewing gum and certain goods prohibited — check restricted items list'],

const SC = {
  ok:   { wrapCls:'s-ok',   label:'OK',          badgeCls:'badge-ok',   pillCls:'op-ok',   pillLabel:'Operational' },
  warn: { wrapCls:'s-warn', label:'Caution',      badgeCls:'badge-warn', pillCls:'op-warn', pillLabel:'Check before booking' },
  no:   { wrapCls:'s-no',   label:'Suspended',    badgeCls:'badge-no',   pillCls:'op-no',   pillLabel:'Do not ship' },
  q:    { wrapCls:'s-q',    label:'Monitor',      badgeCls:'badge-q',    pillCls:'op-warn', pillLabel:'Monitor' }
};

function overallStatus(id) {
  const ss = D[id].carriers.map(c => c.s);
  if (ss.some(s => s === 'no'))             return 'no';
  if (ss.some(s => s === 'warn' || s === 'q')) return 'warn';
  return 'ok';
}

let currentId = null;

function buildSidebar() {
  const list = document.getElementById('destList');
  list.innerHTML = '';
  REGIONS.forEach(r => {
    const grp = document.createElement('div');
    const lbl = document.createElement('div');
    lbl.className = 'region-label';
    lbl.textContent = r.label;
    grp.appendChild(lbl);
    r.ids.forEach(id => {
      const d = D[id];
      const sc = SC[overallStatus(id)];
      const btn = document.createElement('button');
      btn.className = 'dest-btn' + (currentId === id ? ' active' : '');
      btn.id = 'btn-' + id;
      btn.innerHTML = `<span class="dflag">${d.flag}</span><span class="dname">${d.name}</span><span class="dbadge ${sc.badgeCls}">${sc.label}</span>`;
      btn.onclick = () => show(id);
      grp.appendChild(btn);
    });
    list.appendChild(grp);
  });
}

function onCarrierChange(id, ci, val) {
  D[id].carriers[ci].s = val;
  buildSidebar();
  refreshHeading(id);
}

function onNoteChange(id, ci, val) {
  D[id].carriers[ci].note = val;
}

function refreshHeading(id) {
  const ov = overallStatus(id);
  const sc = SC[ov];
  const pill = document.getElementById('overall-pill');
  if (pill) { pill.className = 'overall-pill ' + sc.pillCls; pill.textContent = sc.pillLabel; }
}

function addRule(id) {
  D[id].rules.push('New rule — click to edit');
  show(id);
  const inputs = document.querySelectorAll('.rule-text');
  const last = inputs[inputs.length - 1];
  if (last) { last.focus(); last.select(); }
}

function deleteRule(id, ri) { D[id].rules.splice(ri, 1); show(id); }

function show(id) {
  currentId = id;
  document.querySelectorAll('.dest-btn').forEach(b => b.classList.remove('active'));
  const ab = document.getElementById('btn-' + id);
  if (ab) ab.classList.add('active');

  const d = D[id];
  const ov = overallStatus(id);
  const sc = SC[ov];

  const carrierRows = d.carriers.map((c, ci) => {
    const opts = [
      {v:'ok',   l:'OK'},
      {v:'warn', l:'Caution'},
      {v:'no',   l:'Suspended'},
      {v:'q',    l:'Monitor'}
    ].map(o => `<option value="${o.v}"${c.s===o.v?' selected':''}>${o.l}</option>`).join('');

    const wrap = SC[c.s].wrapCls;

    return `<tr>
      <td class="ct-name">${c.name}</td>
      <td class="ct-note">
        <textarea class="rule-text" rows="1" style="width:100%;padding:0;"
          oninput="onNoteChange('${id}',${ci},this.value);autoResize(this)"
          onblur="onNoteChange('${id}',${ci},this.value)"
        >${c.note}</textarea>
      </td>
      <td class="ct-status">
        <div class="status-select-wrap ${wrap}" id="wrap-${id}-${ci}">
          <div class="status-dot"></div>
          <select class="status-select" onchange="onCarrierChange('${id}',${ci},this.value);updateWrap('${id}',${ci},this.value)">
            ${opts}
          </select>
          <i class="ti ti-chevron-down chevron-icon" aria-hidden="true"></i>
        </div>
      </td>
    </tr>`;
  }).join('');

  const rulesHtml = d.rules.map((r, ri) => `
    <div class="rule-item">
      <i class="ti ti-point-filled rule-icon" aria-hidden="true"></i>
      <textarea class="rule-text" rows="1"
        oninput="D['${id}'].rules[${ri}]=this.value;autoResize(this)"
        onblur="D['${id}'].rules[${ri}]=this.value"
      >${r}</textarea>
      <button class="rule-del" onclick="deleteRule('${id}',${ri})" aria-label="Delete rule"><i class="ti ti-x"></i></button>
    </div>`).join('');

  document.getElementById('detail').innerHTML = `<div class="dp">
    <div class="dest-heading">
      <span class="dest-flag-lg">${d.flag}</span>
      <div><div class="dest-name">${d.name}</div><div class="dest-region-sub">${d.region}</div></div>
      <span class="overall-pill ${sc.pillCls}" id="overall-pill">${sc.pillLabel}</span>
    </div>

    <div class="sec-block">
      <div class="sec-head"><span>Carrier status</span><span class="edit-hint">Click status to change</span></div>
      <table class="carrier-table">${carrierRows}</table>
    </div>

    <div class="sep"></div>

    <div class="sec-block">
      <div class="sec-head"><span>Country rules</span><span class="edit-hint">Click any rule to edit</span></div>
      <div class="rules-list">${rulesHtml}</div>
      <button class="add-rule-btn" onclick="addRule('${id}')"><i class="ti ti-plus" style="font-size:12px;" aria-hidden="true"></i> Add rule</button>
    </div>

    <div class="sep"></div>

    <div class="sec-block">
      <div class="sec-head"><span>Notes</span><span class="edit-hint">Click to edit</span></div>
      <textarea class="notes-area" placeholder="Add notes for this destination…"
        oninput="D['${id}'].notes=this.value"
        onblur="D['${id}'].notes=this.value"
      >${d.notes||''}</textarea>
    </div>
  </div>`;

  document.getElementById('detail').scrollTop = 0;
  document.querySelectorAll('.rule-text').forEach(autoResize);
  document.querySelectorAll('.notes-area').forEach(autoResize);
}

function updateWrap(id, ci, val) {
  const wrap = document.getElementById(`wrap-${id}-${ci}`);
  if (wrap) { wrap.className = 'status-select-wrap ' + SC[val].wrapCls; }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

buildSidebar();
</script>
